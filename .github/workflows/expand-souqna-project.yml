name: Expand Souqna Android project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand project files from ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          root = Path.cwd()

          candidates = [
              root / "Souqna_GitHub_Ready (3).zip",
              root / "Souqna_GitHub_Ready.zip",
          ]

          archive = next((p for p in candidates if p.exists()), None)

          if archive is None:
              raise SystemExit("Souqna project ZIP not found in repository")

          with ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue

                  name = info.filename

                  if name.startswith("project/"):
                      rel = name[len("project/"):]

                  elif name.startswith(".github/workflows/"):
                      rel = "docs/" + name.replace("/", "_")

                  else:
                      rel = "docs/" + name

                  if not rel:
                      continue

                  target = root / rel
                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(info) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          PY

      - name: Commit expanded project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          git commit -m "Expand Souqna Android project [skip ci]"
          git push
